apiVersion: apps/v1
kind: Deployment
metadata:
  name: __APP_NAME__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: __APP_NAME__
  template:
    metadata:
      labels:
        app: __APP_NAME__
    spec:
      containers:
        - name: __APP_NAME__
          image: __IMAGE__
          ports:
            - containerPort: 8080
          env:
            - name: REGION
              value: __REGION__
            - name: HEALTHY
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: __APP_NAME__
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: __DNS_LABEL__
spec:
  type: LoadBalancer
  selector:
    app: __APP_NAME__
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP